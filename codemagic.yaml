workflows:

  # ─────────────────────────────────────────────
  # 1) iOS App Store Release → TestFlight / App Store
  # ─────────────────────────────────────────────
  ios-release:
    name: iOS App Store Release (v1.4.0)
    max_build_duration: 60
    integrations:
      app_store_connect: app_store_connect   # Codemagic > Teams > Integrations'da tanımlı olmalı
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mawelly.blitzmath
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
        BUNDLE_ID: "com.mawelly.blitzmath"
      xcode: latest
      cocoapods: default
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$HOME/Library/Android/sdk" > local.properties
          chmod +x gradlew

      - name: Install CocoaPods
        script: |
          cd iosApp
          pod install --repo-update

      - name: Apply Xcode signing profiles
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build & export signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "iosApp/iosApp.xcworkspace" \
            --scheme "$XCODE_SCHEME"


      - name: Copy IPA to artifact dir
        script: |
          IPA=$(find . -name "*.ipa" -type f | head -n 1)
          if [ -z "$IPA" ]; then
            echo "❌ IPA bulunamadı!"
            exit 1
          fi
          cp "$IPA" "$CM_BUILD_DIR/blitzmath_1.4.0.ipa"
          echo "✅ IPA kopyalandı: $CM_BUILD_DIR/blitzmath_1.4.0.ipa"

    artifacts:
      - blitzmath_1.4.0.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true          # TestFlight'a gönder
        submit_to_app_store: false          # Manuel inceleme için false bırak
                                            # App Store'a direkt göndermek istersen true yap
        beta_groups:
          - App Store Connect Users         # TestFlight beta grubu adı

      email:
        recipients:
          - ozbayv@gmail.com               # Build bitince mail gelsin (kendi mailinizi yazın)
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────
  # 2) iOS Simulator (Hızlı Test)
  # ─────────────────────────────────────────────
  ios-debug:
    name: iOS Simulator Debug Build
    max_build_duration: 30
    environment:
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
      xcode: latest
      cocoapods: default
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$HOME/Library/Android/sdk" > local.properties
          chmod +x gradlew

      - name: Install CocoaPods
        script: |
          cd iosApp
          pod install --repo-update

      - name: Build Simulator App
        script: |
          set -o pipefail
          cd iosApp
          xcodebuild build \
            -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -sdk iphonesimulator \
            -derivedDataPath ../build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package .app as zip
        script: |
          APP=$(find build_output/Build/Products/Debug-iphonesimulator -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "❌ .app bulunamadı!"
            exit 1
          fi
          cd "$(dirname "$APP")"
          zip -r "$CM_BUILD_DIR/blitzmath_simulator.zip" "$(basename "$APP")"
          echo "✅ Simulator zip hazır"

    artifacts:
      - blitzmath_simulator.zip
